<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a73e8">
<title>음성 캘린더</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="음성 캘린더">
<style>
  :root{
    --blue:#1a73e8; --blue-d:#1557b0; --red:#ea4335; --green:#34a853;
    --bg:#f6f8fc; --card:#ffffff; --text:#202124; --sub:#5f6368; --line:#e0e3e8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column;
  }
  header{
    background:var(--card); padding:16px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5;
  }
  header h1{font-size:18px; margin:0; font-weight:700;}
  header h1 span{color:var(--blue);}
  #authBtn{
    border:1px solid var(--line); background:#fff; color:var(--text);
    padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  #authBtn.signed{border-color:var(--green); color:var(--green);}
  main{flex:1; padding:20px; display:flex; flex-direction:column; gap:16px; max-width:560px; width:100%; margin:0 auto;}
  .mic-wrap{display:flex; flex-direction:column; align-items:center; gap:14px; padding:20px 0;}
  #micBtn{
    width:120px; height:120px; border-radius:50%; border:none; cursor:pointer;
    background:var(--blue); color:#fff; font-size:46px;
    box-shadow:0 8px 24px rgba(26,115,232,.35); transition:transform .1s, background .2s;
    display:flex; align-items:center; justify-content:center;
  }
  #micBtn:active{transform:scale(.95);}
  #micBtn.listening{background:var(--red); animation:pulse 1.3s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(234,67,53,.5);}70%{box-shadow:0 0 0 24px rgba(234,67,53,0);}100%{box-shadow:0 0 0 0 rgba(234,67,53,0);}}
  .hint{color:var(--sub); font-size:14px; text-align:center; line-height:1.6;}
  .hint b{color:var(--text);}
  #transcript{
    min-height:52px; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; font-size:16px; line-height:1.5; color:var(--text);
  }
  #transcript:empty::before{content:"여기에 인식된 말이 표시됩니다"; color:#9aa0a6;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:none;
  }
  .card.show{display:block;}
  .card h3{margin:0 0 12px; font-size:14px; color:var(--sub); font-weight:600;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
  .field label{font-size:12px; color:var(--sub);}
  .field input{
    border:1px solid var(--line); border-radius:8px; padding:11px 12px; font-size:16px; width:100%;
    background:#fff; color:var(--text);
  }
  .row{display:flex; gap:10px;}
  .row .field{flex:1;}
  .actions{display:flex; gap:10px; margin-top:4px;}
  .btn{flex:1; padding:13px; border-radius:10px; border:none; font-size:15px; font-weight:700; cursor:pointer;}
  .btn-primary{background:var(--blue); color:#fff;}
  .btn-primary:disabled{opacity:.5;}
  .btn-ghost{background:#eef1f6; color:var(--sub);}
  #status{font-size:14px; text-align:center; min-height:20px; padding:2px;}
  #status.ok{color:var(--green);} #status.err{color:var(--red);} #status.info{color:var(--sub);}
  .events{display:flex; flex-direction:column; gap:8px;}
  .ev{
    background:var(--card); border:1px solid var(--line); border-left:4px solid var(--blue);
    border-radius:8px; padding:11px 13px; font-size:14px;
  }
  .ev .t{font-weight:700;} .ev .d{color:var(--sub); font-size:12px; margin-top:3px;}
  .sec-title{font-size:13px; color:var(--sub); font-weight:600; margin:4px 0;}
  footer{padding:14px; text-align:center; color:#9aa0a6; font-size:11px;}
  .warn{background:#fff8e1; border:1px solid #ffe082; color:#8a6d00; padding:12px; border-radius:10px; font-size:13px; line-height:1.6; display:none;}
  .warn.show{display:block;}
</style>
</head>
<body>
<header>
  <h1>🎙️ 음성 <span>캘린더</span></h1>
  <button id="authBtn">로그인</button>
</header>

<main>
  <div class="warn" id="cfgWarn">
    ⚙️ 아직 <b>구글 클라이언트 ID</b>가 설정되지 않았습니다. 사용 설명서를 따라
    <code>index.html</code> 상단의 <code>CLIENT_ID</code> 값을 입력해 주세요.
  </div>

  <div class="mic-wrap">
    <button id="micBtn" aria-label="녹음">🎤</button>
    <div class="hint">
      버튼을 누르고 말하세요<br>
      예) <b>"7월 24일 15시에 김대리 상담 기록해줘"</b>
    </div>
  </div>

  <div id="transcript"></div>

  <div class="card" id="reviewCard">
    <h3>일정 확인 후 등록</h3>
    <div class="field">
      <label>제목</label>
      <input id="fTitle" type="text" placeholder="일정 제목">
    </div>
    <div class="row">
      <div class="field"><label>날짜</label><input id="fDate" type="date"></div>
      <div class="field"><label>시작 시간</label><input id="fTime" type="time"></div>
    </div>
    <div class="field">
      <label>소요 시간(분)</label>
      <input id="fDur" type="number" value="60" min="5" step="5">
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="cancelBtn">취소</button>
      <button class="btn btn-primary" id="saveBtn">캘린더에 등록</button>
    </div>
  </div>

  <div id="status"></div>

  <div>
    <div class="sec-title">최근 등록한 일정</div>
    <div class="events" id="recent"></div>
  </div>
</main>

<footer>행정사법인 브레인 · 음성 일정 기록 도구</footer>

<script>
/* ====================================================================
   1) 설정 — 아래 CLIENT_ID 를 본인의 구글 OAuth 클라이언트 ID로 교체
   ==================================================================== */
const CLIENT_ID = "여기에_클라이언트_ID_붙여넣기.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/calendar.events";
const CAL_ID = "primary";   // 기본 캘린더

/* ==================================================================== */
const $ = id => document.getElementById(id);
let tokenClient = null, accessToken = null, parsed = null;

/* ---------- 구글 로그인 (Google Identity Services) ---------- */
function initGis(){
  if(!window.google || !google.accounts){ setTimeout(initGis, 300); return; }
  if(CLIENT_ID.startsWith("여기에")){ $("cfgWarn").classList.add("show"); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp)=>{
      if(resp.error){ setStatus("로그인 실패: "+resp.error, "err"); return; }
      accessToken = resp.access_token;
      $("authBtn").textContent = "✓ 로그인됨";
      $("authBtn").classList.add("signed");
      setStatus("구글 계정에 연결되었습니다.", "ok");
      if(pendingSave){ pendingSave=false; saveEvent(); }
    }
  });
}
$("authBtn").onclick = ()=>{
  if(!tokenClient){ setStatus("클라이언트 ID를 먼저 설정하세요.", "err"); return; }
  tokenClient.requestAccessToken({prompt: accessToken ? "" : "consent"});
};

/* ---------- 음성 인식 (Web Speech API) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, listening = false;
if(SR){
  recog = new SR();
  recog.lang = "ko-KR";
  recog.interimResults = true;
  recog.continuous = false;
  recog.onresult = (e)=>{
    let txt = "";
    for(let i=0;i<e.results.length;i++) txt += e.results[i][0].transcript;
    $("transcript").textContent = txt;
    if(e.results[e.results.length-1].isFinal) handleText(txt);
  };
  recog.onend = ()=>{ listening=false; $("micBtn").classList.remove("listening"); };
  recog.onerror = (e)=>{ setStatus("음성 인식 오류: "+e.error, "err"); };
}else{
  setStatus("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용하세요.", "err");
}
$("micBtn").onclick = ()=>{
  if(!recog) return;
  if(listening){ recog.stop(); return; }
  $("transcript").textContent=""; setStatus("", "info");
  try{ recog.start(); listening=true; $("micBtn").classList.add("listening"); }
  catch(err){ /* 이미 실행중 */ }
};

/* ---------- 한국어 날짜/시간 파서 ---------- */
const KNUM = {영:0,공:0,일:1,이:2,삼:3,사:4,오:5,육:6,칠:7,팔:8,구:9,십:10};
function korToNum(s){
  if(/^\d+$/.test(s)) return parseInt(s,10);
  if(s in KNUM) return KNUM[s];
  // 간단한 십단위 (열, 스물 등은 시계 표현에서 드물어 숫자 위주)
  return NaN;
}
function parseKorean(text){
  const t = text.replace(/\s+/g,' ').trim();
  const now = new Date();
  let year = now.getFullYear(), month=null, day=null, hour=null, min=0;

  // 상대 날짜
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if(/모레|내일모레/.test(t)){ base.setDate(base.getDate()+2); month=base.getMonth()+1; day=base.getDate(); }
  else if(/내일/.test(t)){ base.setDate(base.getDate()+1); month=base.getMonth()+1; day=base.getDate(); }
  else if(/오늘/.test(t)){ month=base.getMonth()+1; day=base.getDate(); }

  // N월 N일
  const md = t.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(md){ month=parseInt(md[1]); day=parseInt(md[2]); }
  else{
    const dOnly = t.match(/(\d{1,2})\s*일/);
    if(dOnly && month===null){ month=now.getMonth()+1; day=parseInt(dOnly[1]); }
  }

  // 오전/오후 + N시 M분
  const ampm = /(오후|저녁|밤|낮)/.test(t) ? "pm" : (/(오전|새벽|아침)/.test(t) ? "am" : null);
  const hm = t.match(/(\d{1,2})\s*시\s*(?:(\d{1,2})\s*분|반)?/);
  if(hm){
    hour = parseInt(hm[1]);
    if(/반/.test(hm[0]) && !hm[2]) min = 30;
    else if(hm[2]) min = parseInt(hm[2]);
    if(ampm==="pm" && hour < 12) hour += 12;
    if(ampm==="am" && hour === 12) hour = 0;
    // 오전/오후 명시 없이 1~7시는 통상 오후로 보정하지 않음(그대로 둠)
  }

  // 제목 추출: 날짜/시간 토큰과 '기록/등록/추가/일정' 명령어 제거
  let title = t
    .replace(/\d{1,2}\s*월\s*\d{1,2}\s*일/g,'')
    .replace(/\d{1,2}\s*일/g,'')
    .replace(/(오전|오후|저녁|밤|낮|새벽|아침|오늘|내일|모레|내일모레)/g,'')
    .replace(/\d{1,2}\s*시\s*(?:\d{1,2}\s*분|반)?/g,'')
    .replace(/(에|을|를|좀|해줘|해 줘|등록|기록|추가|저장|일정|캘린더|잡아|잡아줘|넣어줘|넣어)/g,' ')
    .replace(/\s+/g,' ').trim();
  if(!title) title = "일정";

  // 유효성
  if(month===null || day===null){ month = now.getMonth()+1; day = now.getDate(); }
  if(hour===null){ hour = 9; } // 시간 미지정 시 오전 9시

  // 연도 보정: 지정 월이 이미 지났으면 내년
  const cand = new Date(year, month-1, day, hour, min);
  if(cand < new Date(now.getTime()-6*3600*1000) && !md && !/오늘|내일|모레/.test(t)){
    // 과거로 보이면 그대로 (사용자 판단), 자동 내년화는 하지 않음
  }
  return { title, year, month, day, hour, min };
}

function pad(n){return String(n).padStart(2,'0');}
function handleText(text){
  parsed = parseKorean(text);
  $("fTitle").value = parsed.title;
  $("fDate").value = `${parsed.year}-${pad(parsed.month)}-${pad(parsed.day)}`;
  $("fTime").value = `${pad(parsed.hour)}:${pad(parsed.min)}`;
  $("reviewCard").classList.add("show");
  setStatus("내용을 확인하고 '캘린더에 등록'을 누르세요.", "info");
}

$("cancelBtn").onclick = ()=>{ $("reviewCard").classList.remove("show"); setStatus("",""); };

/* ---------- 캘린더 등록 ---------- */
let pendingSave = false;
$("saveBtn").onclick = ()=>{
  if(!accessToken){ pendingSave=true; setStatus("구글 로그인 창을 엽니다…","info");
    if(tokenClient) tokenClient.requestAccessToken({prompt:"consent"}); return; }
  saveEvent();
};
async function saveEvent(){
  const title = $("fTitle").value.trim() || "일정";
  const date = $("fDate").value, time = $("fTime").value;
  const dur = parseInt($("fDur").value||"60",10);
  if(!date || !time){ setStatus("날짜와 시간을 입력하세요.","err"); return; }
  const start = new Date(`${date}T${time}:00`);
  const end = new Date(start.getTime()+dur*60000);
  const body = {
    summary: title,
    start:{ dateTime:start.toISOString(), timeZone:"Asia/Seoul" },
    end:{ dateTime:end.toISOString(), timeZone:"Asia/Seoul" }
  };
  setStatus("등록 중…","info"); $("saveBtn").disabled=true;
  try{
    const r = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CAL_ID)}/events`,{
      method:"POST",
      headers:{ "Authorization":"Bearer "+accessToken, "Content-Type":"application/json" },
      body: JSON.stringify(body)
    });
    if(r.status===401){ accessToken=null; pendingSave=true;
      tokenClient.requestAccessToken({prompt:""}); return; }
    if(!r.ok){ throw new Error("HTTP "+r.status+" "+(await r.text())); }
    const ev = await r.json();
    setStatus("✓ 구글 캘린더에 등록되었습니다.","ok");
    addRecent(title, start, ev.htmlLink);
    $("reviewCard").classList.remove("show");
    $("transcript").textContent="";
  }catch(err){ setStatus("등록 실패: "+err.message,"err"); }
  finally{ $("saveBtn").disabled=false; }
}
function addRecent(title, start, link){
  const el = document.createElement("div"); el.className="ev";
  const ds = start.toLocaleString("ko-KR",{month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'});
  el.innerHTML = `<div class="t">${title}</div><div class="d">${ds}</div>`;
  if(link){ el.style.cursor="pointer"; el.onclick=()=>window.open(link,"_blank"); }
  $("recent").prepend(el);
}
function setStatus(msg, cls){ const s=$("status"); s.textContent=msg; s.className=cls||""; }

/* ---------- 서비스워커 등록 (PWA) ---------- */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
initGis();
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
